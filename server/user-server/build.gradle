plugins {
    id "java-common-conventions"
    id "spring-common-conventions"
}

repositories {
    maven {
        url "https://packages.confluent.io/maven/"
    }
}
dependencyManagement {
    imports {
        mavenBom("org.springframework.cloud:spring-cloud-dependencies:2025.0.0")
    }
}
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation "org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j"

    // kafka
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.apache.kafka:kafka-streams'
    implementation 'io.confluent:kafka-avro-serializer:8.0.0'
    implementation "io.confluent:kafka-streams-avro-serde:8.0.0"
    implementation 'io.confluent:kafka-schema-registry-client:8.0.0'

    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    implementation 'io.minio:minio:8.5.17'


    implementation project(':data:user-active-rdb')
    implementation project(':data:user-active-memory')
    implementation project(':data:user-active-object')
    implementation project(':data:user-active-mq')

    implementation project(':common:avro')
    implementation project(':common:snowflake')

    testImplementation 'org.springframework.kafka:spring-kafka-test'
}